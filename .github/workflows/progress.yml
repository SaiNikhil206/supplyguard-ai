name: progress-board

on:
  push:
    branches: [collaboration, main]
    paths:
      - "tasks/**"
      - "scripts/progress.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: progress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate PROGRESS.md
        run: python scripts/progress.py all --write
      - name: Commit if changed
        run: |
          if git diff --quiet -- PROGRESS.md; then
            echo "PROGRESS.md unchanged"
            exit 0
          fi
          git config user.name "progress-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROGRESS.md
          git commit -m "chore(progress): regenerate PROGRESS.md [skip ci]"
          git push
